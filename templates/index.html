<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sand</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Ensuring the BMC button fits the menu style */
        .bmc-wrap {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1.5rem;
        }
        .bmc-wrap img {
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .bmc-wrap img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <canvas id="sand-canvas"></canvas>

    <div id="menu-container">
        <div id="burger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="controls-container">
            <button id="reset-btn">Reset</button>
            
            <div class="control-group">
                <label for="palette-picker">Colour Palette</label>
                <select id="palette-picker">
                    <option value="desert">Desert</option>
                    <option value="beach">Beach</option>
                    <option value="forest">Forest</option>
                    <option value="synthwave">Synthwave</option>
                    <option value="lava">Lava</option>
                </select>
            </div>

            <div class="control-group">
                <label for="gravity-slider">Fall Speed</label>
                <input type="range" id="gravity-slider" min="1" max="10" value="2" title="1=Fast, 10=Slow">
            </div>

            <div class="control-group">
                <label for="wind-slider">Wind Control</label>
                <input type="range" id="wind-slider" min="-100" max="100" value="0" title="Left < 0 > Right">
            </div>

            <div class="bmc-wrap">
                <a href="https://buymeacoffee.com/marklally" target="_blank">
                    <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" 
                         alt="Buy Me A Coffee" 
                         style="height: 40px !important; width: 145px !important;">
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
